<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ChatGPT fixture</title>
    <style>
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #fff; color: #1f2328; }
      main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
      #sent { list-style: none; padding: 0; margin: 0 0 24px; }
      #sent li { background: #f4f4f4; border-radius: 18px; padding: 10px 16px; margin-left: auto; width: fit-content; max-width: 80%; }
      form { display: flex; gap: 8px; align-items: flex-end; border: 1px solid #d1d9e0; border-radius: 24px; padding: 10px 10px 10px 18px; }
      #composer { flex: 1; }
      .ProseMirror { min-height: 48px; outline: none; white-space: pre-wrap; }
      .ProseMirror p { margin: 0; }
      button { border: 0; border-radius: 50%; width: 36px; height: 36px; background: #1f2328; color: #fff; font-size: 16px; }
      button:disabled { opacity: 0.3; }
    </style>
  </head>
  <body>
    <main>
      <ol id="sent"></ol>
      <form onsubmit="return false">
        <div id="composer"></div>
        <button type="button" data-testid="send-button" aria-label="Send prompt">↑</button>
      </form>
    </main>
    <script>/*EDITOR_BUNDLE*/</script>
  </body>
</html>
